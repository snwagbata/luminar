name: luminar
description: "Set up and control Sengled Bluetooth Mesh bulbs."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  pointycastle: ^4.0.0
  flutter_secure_storage: ^11.2.0
  google_fonts: ^8.2.1
  flutter_reactive_ble: ^5.6.0
  permission_handler: ^13.0.2
  dart_debounce_throttle: ^2.4.6
  share_plus: ^13.3.0
  freezed_annotation: ^3.1.0
  provider: ^6.1.5+1
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^4.0.2
  build_runner: ^2.16.1
  path_parsing: ^1.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  # Figtree and Bricolage Grotesque, so fonts are never fetched at runtime.
  assets:
    - google_fonts/
  uses-material-design: true

# App icon: dart run flutter_launcher_icons
# (images from tool/brand/render_brand_assets.dart)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#182033"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  adaptive_icon_monochrome: assets/brand/icon_monochrome.png
  # The images are already sized for the launcher's safe zone.
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24

# Splash screen: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#182033"
  image: assets/brand/splash.png
  android_12:
    color: "#182033"
    image: assets/brand/splash_android12.png
    icon_background_color: "#182033"
  ios: true
  android: true
  web: false
